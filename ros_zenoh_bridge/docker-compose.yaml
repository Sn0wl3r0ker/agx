version: '3.8'

services:
  ros1_node:
    image: ros:noetic-ros-core
    container_name: zenoh_ros1
    environment:
      - ROS_MASTER_URI=http://localhost:11311
    # 暴力但最快的 PoC 做法：直接在容器內下載 Zenoh Bridge 並啟動
    command: >
      bash -c " apt-get update && apt-get install -y wget unzip ros-noetic-std-msgs > /dev/null 2>&1 && wget -q https://github.com/eclipse-zenoh/zenoh-plugin-ros1/releases/download/0.10.1-rc/zenoh-bridge-ros1-x86_64-unknown-linux-gnu-v0.10.1-rc.zip && unzip -q zenoh-bridge-ros1-*.zip && source /opt/ros/noetic/setup.bash && roscore & sleep 2 && ./zenoh-bridge-ros1 -l tcp/0.0.0.0:7447 & sleep 2 && echo 'ROS 1: 開始發布 AMR 導航狀態...' && rostopic pub /amr_status std_msgs/String 'data: \"AMR Navigation Active\"' -r 1 "

  ros2_node:
    image: ros:humble-ros-core
    container_name: zenoh_ros2
    depends_on:
      - ros1_node
    command: >
      bash -c " apt-get update && apt-get install -y wget unzip ros-humble-std-msgs ros-humble-ros2topic > /dev/null 2>&1 && wget -q https://github.com/eclipse-zenoh/zenoh-plugin-dds/releases/download/0.10.1-rc/zenoh-bridge-dds-x86_64-unknown-linux-gnu-v0.10.1-rc.zip && unzip -q zenoh-bridge-dds-*.zip && source /opt/ros/humble/setup.bash && echo 'ROS 2: 正在透過 TCP 連接 ROS 1 Bridge...' && ./zenoh-bridge-dds -e tcp/ros1_node:7447 & sleep 5 && echo 'ROS 2: 嘗試監聽來自 ROS 1 的 Topic...' && ros2 topic echo /amr_status "

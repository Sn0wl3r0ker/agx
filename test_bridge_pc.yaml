# ==============================================================================
#  PC 模式 Bridge 測試用 Compose
#  使用客製化的 Python Zenoh 橋樑 (Custom ROS1/ROS2 Bridge)
# ==============================================================================

services:
  # --- ROS 1 ---
  roscore:
    image: ros:noetic-ros-core
    container_name: bridge_test_roscore
    command: roscore
    environment:
      - ROS_MASTER_URI=http://roscore:11311
      - ROS_HOSTNAME=roscore
    networks:
      - bridge_test

  # --- ROS 1 Side Bridge ---
  bridge:
    image: agx_ros/bridge:latest
    container_name: bridge_test_bridge
    depends_on:
      - roscore
    environment:
      - ROS_MASTER_URI=http://roscore:11311
      - ROS_HOSTNAME=bridge
    volumes:
      - ./ros_zenoh_bridge:/ros_zenoh_bridge
    tty: true
    stdin_open: true
    # 啟動時先安裝 zenoh，然後啟動我們的 ROS1 端橋樑
    command: >
      bash -c "
        apt-get update && apt-get install -y python3-pip &&
        pip3 install eclipse-zenoh==1.0.2 &&
        source /opt/ros/noetic/setup.bash &&
        python3 /ros_zenoh_bridge/bridge_ros1.py
      "
    networks:
      - bridge_test

  # --- ROS 2 Side Bridge ---
  planning:
    image: agx_ros/planning:latest
    container_name: bridge_test_planning
    environment:
      - ROS_DOMAIN_ID=0
    volumes:
      - ./ros_zenoh_bridge:/ros_zenoh_bridge
    tty: true
    stdin_open: true
    # 啟動時先安裝 zenoh，然後啟動我們的 ROS2 端橋樑
    command: >
      bash -c "
        apt-get update && apt-get install -y python3-pip &&
        pip3 install eclipse-zenoh==1.0.2 &&
        source /opt/ros/humble/setup.bash &&
        python3 /ros_zenoh_bridge/bridge_ros2.py
      "
    networks:
      - bridge_test

networks:
  bridge_test:
    driver: bridge

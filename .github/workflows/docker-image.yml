name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true
        
    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3
      
    - name: Lint all Dockerfiles (Syntax Verification)
      run: |
        # 使用 hadolint 檢查所有 Dockerfile 的語法與最佳實踐
        find . -maxdepth 2 -name "*Dockerfile*" -type f | while read -r file; do
          echo "Linting $file..."
          docker run --rm -i hadolint/hadolint < "$file" || echo "Found warnings in $file but continuing..."
        done

    - name: Build all Dockerfiles (Build Verification)
      run: |
        # 尋找所有 Dockerfile 並嘗試 Build 來驗證是否能成功建置
        find . -maxdepth 2 -name "Dockerfile*" -type f | while read -r file; do
          dir=$(dirname "$file")
          echo "========================================"
          echo "Verifying build for $file in context $dir"
          echo "========================================"
          docker build "$dir" -f "$file"
          # 立即清理建置暫存與映象檔，避免下一次 build 時 No space left on device
          docker system prune -a -f
          docker builder prune -a -f
        done
